<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Centre - Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --border-color: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        h1 {
            font-size: 1.5rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .progress-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .card h3 {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .card .progress-value {
            font-size: 2rem;
            font-weight: bold;
        }
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .subject-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }
        .subject-card h4 {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .tracker-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Study Centre</h1>
            <button onclick="resetData()">Reset Data</button>
        </header>

        <div class="progress-grid">
            <div class="card">
                <h3>Overall Syllabus Progress</h3>
                <div class="progress-value" id="syllabusProgress">0%</div>
            </div>
            <div class="card">
                <h3>Practice & Problems</h3>
                <div class="progress-value" id="practiceProgress">0%</div>
            </div>
        </div>

        <h2>Subject Overview Cards</h2>
        <div class="subjects-grid" id="subjectsOverview">
            <!-- Dynamic Subject Cards -->
        </div>

        <div class="tracker-section">
            <h2>Chapter & Exercise Tracker</h2>
            <p style="color: var(--text-muted); margin-top: 10px;">Select your stream to load customized curriculum.</p>
        </div>
    </div>

    <script>
        // Complete updated NCERT curriculum for PCM and PCB
        const PREDEFINED_CURRICULUM = {
            "PCM": {
                "Physics": [
                    "Electric Charges and Fields",
                    "Electrostatic Potential and Capacitance",
                    "Current Electricity",
                    "Moving Charges and Magnetism",
                    "Magnetism and Matter",
                    "Electromagnetic Induction",
                    "Alternating Current",
                    "Electromagnetic Waves",
                    "Ray Optics and Optical Instruments",
                    "Wave Optics",
                    "Dual Nature of Radiation and Matter",
                    "Atoms",
                    "Nuclei",
                    "Semiconductor Electronics: Materials, Devices and Simple Circuits"
                ],
                "Chemistry": [
                    "Solutions",
                    "Electrochemistry",
                    "Chemical Kinetics",
                    "The d- and f-Block Elements",
                    "Coordination Compounds",
                    "Haloalkanes and Haloarenes",
                    "Alcohols, Phenols and Ethers",
                    "Aldehydes, Ketones and Carboxylic Acids",
                    "Amines",
                    "Biomolecules"
                ],
                "Mathematics": [
                    "Relations and Functions",
                    "Inverse Trigonometric Functions",
                    "Matrices",
                    "Determinants",
                    "Continuity and Differentiability",
                    "Application of Derivatives",
                    "Integrals",
                    "Application of Integrals",
                    "Differential Equations",
                    "Vector Algebra",
                    "Three Dimensional Geometry",
                    "Linear Programming",
                    "Probability"
                ]
            },
            "PCB": {
                "Physics": [
                    "Electric Charges and Fields",
                    "Electrostatic Potential and Capacitance",
                    "Current Electricity",
                    "Moving Charges and Magnetism",
                    "Magnetism and Matter",
                    "Electromagnetic Induction",
                    "Alternating Current",
                    "Electromagnetic Waves",
                    "Ray Optics and Optical Instruments",
                    "Wave Optics",
                    "Dual Nature of Radiation and Matter",
                    "Atoms",
                    "Nuclei",
                    "Semiconductor Electronics: Materials, Devices and Simple Circuits"
                ],
                "Chemistry": [
                    "Solutions",
                    "Electrochemistry",
                    "Chemical Kinetics",
                    "The d- and f-Block Elements",
                    "Coordination Compounds",
                    "Haloalkanes and Haloarenes",
                    "Alcohols, Phenols and Ethers",
                    "Aldehydes, Ketones and Carboxylic Acids",
                    "Amines",
                    "Biomolecules"
                ],
                "Biology": [
                    "Sexual Reproduction in Flowering Plants",
                    "Human Reproduction",
                    "Reproductive Health",
                    "Principles of Inheritance and Variation",
                    "Molecular Basis of Inheritance",
                    "Evolution",
                    "Human Health and Disease",
                    "Microbes in Human Welfare",
                    "Biotechnology: Principles and Processes",
                    "Biotechnology and its Applications",
                    "Organisms and Populations",
                    "Ecosystem",
                    "Biodiversity and Conservation"
                ]
            }
        };

        function loadDashboard() {
            let userStream = localStorage.getItem("userStream") || "PCM";
            
            if (!PREDEFINED_CURRICULUM[userStream]) {
                userStream = "PCM";
                localStorage.setItem("userStream", userStream);
            }

            const subjects = PREDEFINED_CURRICULUM[userStream];
            const subjectsContainer = document.getElementById("subjectsOverview");
            subjectsContainer.innerHTML = "";

            for (let subName in subjects) {
                let card = document.createElement("div");
                card.className = "subject-card";
                card.innerHTML = `
                    <h4>${subName} <span>50%</span></h4>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">${subjects[subName].length} Chapters</p>
                `;
                subjectsContainer.appendChild(card);
            }
        }

        function resetData() {
            localStorage.clear();
            window.location.href = "onboarding.html";
        }

        window.onload = function() {
            if (!localStorage.getItem("userStream")) {
                window.location.href = "onboarding.html";
                return;
            }
            loadDashboard();
        };
    </script>
</body>
</html>
