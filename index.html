<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #38bdf8;
            --progress-blue: #0ea5e9;
            --progress-green: #10b981;
            --progress-alert: #ef4444;
            --progress-red: #f87171;
            --progress-purple: #c084fc;
            --border-color: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, border-color 0.2s;
        }

        button:hover {
            background-color: var(--border-color);
            border-color: var(--text-muted);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 24px;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 16px;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .subjects-overview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .subject-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subject-info h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .subject-info p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .subject-stat {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .tracker-section {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 24px;
        }

        .tracker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .tabs-container {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            background-color: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }

        .tab-btn.active {
            background-color: var(--border-color);
            color: var(--text-main);
            border-color: var(--text-main);
        }

        .stream-indicator {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .stream-pcm { background-color: rgba(56, 189, 248, 0.15); color: var(--accent-blue); }
        .stream-pcb { background-color: rgba(16, 185, 129, 0.15); color: var(--progress-green); }

        .section-breakdown {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--accent-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            font-size: 0.8rem;
        }

        .chapter-list {
            list-style: none;
        }

        .chapter-item {
            background-color: rgba(17, 24, 39, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .chapter-info {
            flex: 1;
        }

        .chapter-title-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chapter-info h5 {
            font-size: 1rem;
            font-weight: 600;
        }

        .chapter-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .progress-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-radio {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-radio.active {
            background-color: var(--progress-blue);
            color: var(--bg-color);
            border-color: var(--progress-blue);
        }

        .icon-btn {
            background: transparent;
            border: none;
            padding: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .delete-icon { color: var(--progress-alert); }
        .edit-icon { color: var(--text-muted); }
        .edit-icon:hover { color: var(--accent-blue); }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .stats-grid { grid-template-columns: 1fr; gap: 12px; }
            .subjects-overview { grid-template-columns: 1fr; gap: 12px; }
            .chapter-item { flex-direction: column; align-items: flex-start; }
            .chapter-actions { width: 100%; flex-direction: column; align-items: flex-start; gap: 10px; margin-top: 8px; }
            .progress-controls { width: 100%; justify-content: space-between; }
            .tracker-section { padding: 16px; }
            .header-actions { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Study Centre</h1>
            <div class="header-actions">
                <button onclick="window.location.href='onboarding.html'">Load Preset</button>
                <button class="add-btn" style="padding:8px 16px;" onclick="addSubjectPrompt()">Add Subject</button>
                <button onclick="resetData()" style="border-color: var(--progress-alert); color: var(--progress-alert);">Reset Data</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Overall Syllabus Progress</h3>
                <div class="stat-value">
                    <span id="syllabusProgressText">0%</span>
                    <span id="streamBadge" class="stream-indicator">Loading...</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="syllabusProgressBar" class="progress-bar-fill" style="width: 0%; background-color: var(--progress-blue);"></div>
                </div>
            </div>
            <div class="stat-card">
                <h3>Practice & Problems</h3>
                <div class="stat-value">
                    <span id="practiceProgressText">0%</span>
                    <span style="font-size: 1rem; color: var(--text-muted);" id="practiceSubText">0 Exercises Total</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="practiceProgressBar" class="progress-bar-fill" style="width: 0%; background-color: var(--progress-green);"></div>
                </div>
            </div>
        </div>

        <h2>Subject Overview Cards</h2>
        <div class="subjects-overview" id="subjectsOverviewGrid"></div>

        <div class="tracker-section">
            <div class="tracker-header">
                <h2>Chapter & Exercise Tracker</h2>
            </div>
            <div class="tabs-container" id="subjectTabsContainer"></div>
            <div id="chaptersContainer"></div>
        </div>
    </div>

    <script>
        const DEFAULT_CURRICULUM = {
            "PCM": {
                "Physics": {
                    "color": "var(--accent-blue)",
                    "chapters": ["Electric Charges and Fields", "Electrostatic Potential and Capacitance", "Current Electricity", "Moving Charges and Magnetism", "Magnetism and Matter", "Electromagnetic Induction", "Alternating Current", "Electromagnetic Waves", "Ray Optics and Optical Instruments", "Wave Optics", "Dual Nature of Radiation and Matter", "Atoms", "Nuclei", "Semiconductor Electronics: Materials, Devices and Simple Circuits"]
                },
                "Chemistry": {
                    "color": "var(--progress-red)",
                    "chapters": ["Solutions", "Electrochemistry", "Chemical Kinetics", "The d- and f-Block Elements", "Coordination Compounds", "Haloalkanes and Haloarenes", "Alcohols, Phenols and Ethers", "Aldehydes, Ketones and Carboxylic Acids", "Amines", "Biomolecules"]
                },
                "Mathematics": {
                    "color": "var(--progress-purple)",
                    "chapters": ["Relations and Functions", "Inverse Trigonometric Functions", "Matrices", "Determinants", "Continuity and Differentiability", "Application of Derivatives", "Integrals", "Application of Integrals", "Differential Equations", "Vector Algebra", "Three Dimensional Geometry", "Linear Programming", "Probability"]
                }
            },
            "PCB": {
                "Physics": {
                    "color": "var(--accent-blue)",
                    "chapters": ["Electric Charges and Fields", "Electrostatic Potential and Capacitance", "Current Electricity", "Moving Charges and Magnetism", "Magnetism and Matter", "Electromagnetic Induction", "Alternating Current", "Electromagnetic Waves", "Ray Optics and Optical Instruments", "Wave Optics", "Dual Nature of Radiation and Matter", "Atoms", "Nuclei", "Semiconductor Electronics: Materials, Devices and Simple Circuits"]
                },
                "Chemistry": {
                    "color": "var(--progress-red)",
                    "chapters": ["Solutions", "Electrochemistry", "Chemical Kinetics", "The d- and f-Block Elements", "Coordination Compounds", "Haloalkanes and Haloarenes", "Alcohols, Phenols and Ethers", "Aldehydes, Ketones and Carboxylic Acids", "Amines", "Biomolecules"]
                },
                "Biology": {
                    "color": "var(--progress-green)",
                    "chapters": ["Sexual Reproduction in Flowering Plants", "Human Reproduction", "Reproductive Health", "Principles of Inheritance and Variation", "Molecular Basis of Inheritance", "Evolution", "Human Health and Disease", "Microbes in Human Welfare", "Biotechnology: Principles and Processes", "Biotechnology and its Applications", "Organisms and Populations", "Ecosystem", "Biodiversity and Conservation"]
                }
            }
        };

        let currentSubjectTab = "";
        let userStream = localStorage.getItem("userStream") || "PCM";

        function getCurriculum() {
            let data = localStorage.getItem("customCurriculum");
            return data ? JSON.parse(data) : DEFAULT_CURRICULUM[userStream] || DEFAULT_CURRICULUM["PCM"];
        }

        function saveCurriculum(data) {
            localStorage.setItem("customCurriculum", JSON.stringify(data));
        }

        function getStoredProgress() {
            let data = localStorage.getItem("detailedStudyProgress");
            return data ? JSON.parse(data) : {};
        }

        function saveStoredProgress(data) {
            localStorage.setItem("detailedStudyProgress", JSON.stringify(data));
        }

        function initData() {
            let curriculum = getCurriculum();
            let progress = getStoredProgress();

            if (!currentSubjectTab || !curriculum[currentSubjectTab]) {
                currentSubjectTab = Object.keys(curriculum)[0] || "";
            }

            Object.keys(curriculum).forEach(subName => {
                if (!progress[subName]) progress[subName] = {};
                curriculum[subName].chapters.forEach(chapName => {
                    if (!progress[subName][chapName]) {
                        progress[subName][chapName] = { theory: 0, practice: 0 };
                    }
                });
            });
            saveStoredProgress(progress);
        }

        function updateProgress(subject, chapter, type, value) {
            let progress = getStoredProgress();
            if (!progress[subject]) progress[subject] = {};
            if (!progress[subject][chapter]) progress[subject][chapter] = { theory: 0, practice: 0 };
            progress[subject][chapter][type] = value;
            saveStoredProgress(progress);
            renderDashboard();
        }

        function editChapter(subject, oldChapName) {
            let newName = prompt("Edit Chapter Name:", oldChapName);
            if (newName && newName.trim() !== "" && newName !== oldChapName) {
                newName = newName.trim();
                let curriculum = getCurriculum();
                let chapList = curriculum[subject].chapters;
                let index = chapList.indexOf(oldChapName);
                if (index > -1) { chapList[index] = newName; saveCurriculum(curriculum); }
                let progress = getStoredProgress();
                if (progress[subject] && progress[subject][oldChapName]) { progress[subject][newName] = progress[subject][oldChapName]; delete progress[subject][oldChapName]; saveStoredProgress(progress); }
                renderDashboard();
            }
        }

        function deleteChapter(subject, chapter) {
            if (confirm(`Are you sure you want to delete "${chapter}"?`)) {
                let curriculum = getCurriculum();
                let chapList = curriculum[subject].chapters;
                let index = chapList.indexOf(chapter);
                if (index > -1) { chapList.splice(index, 1); saveCurriculum(curriculum); }
                let progress = getStoredProgress();
                if (progress[subject]) { delete progress[subject][chapter]; saveStoredProgress(progress); }
                renderDashboard();
            }
        }

        function addChapter(subject) {
            let name = prompt("Enter new chapter name:");
            if (name && name.trim() !== "") {
                let curriculum = getCurriculum();
                curriculum[subject].chapters.push(name.trim());
                saveCurriculum(curriculum);
                renderDashboard();
            }
        }

        function addSubjectPrompt() {
            let name = prompt("Enter new subject name:");
            if (name && name.trim() !== "") {
                name = name.trim();
                let curriculum = getCurriculum();
                if (!curriculum[name]) {
                    curriculum[name] = { color: "var(--accent-blue)", chapters: [] };
                    saveCurriculum(curriculum);
                    currentSubjectTab = name;
                    renderDashboard();
                }
            }
        }

        function renderDashboard() {
            initData();
            let curriculum = getCurriculum();
            let progress = getStoredProgress();

            let streamBadge = document.getElementById("streamBadge");
            streamBadge.textContent = userStream;
            streamBadge.className = `stream-indicator stream-${userStream.toLowerCase()}`;

            let overviewGrid = document.getElementById("subjectsOverviewGrid");
            overviewGrid.innerHTML = "";

            let totalChaptersAll = 0;
            let totalTheorySum = 0;
            let totalPracticeSum = 0;

            Object.keys(curriculum).forEach(subName => {
                let chapList = curriculum[subName].chapters;
                let totalCount = chapList.length;
                totalChaptersAll += totalCount;

                let subjectTheorySum = 0;
                chapList.forEach(chapName => {
                    if (progress[subName] && progress[subName][chapName]) {
                        let theoryVal = progress[subName][chapName].theory || 0;
                        let practiceVal = progress[subName][chapName].practice || 0;
                        subjectTheorySum += theoryVal;
                        totalTheorySum += theoryVal;
                        totalPracticeSum += practiceVal;
                    }
                });

                let subPercentage = totalCount > 0 ? Math.round(subjectTheorySum / totalCount) : 0;
                let cardColor = subName === "Chemistry" ? "var(--progress-red)" : (curriculum[subName].color || "var(--accent-blue)");

                let card = document.createElement("div");
                card.className = "subject-card";
                card.innerHTML = `
                    <div class="subject-info">
                        <h4>${subName}</h4>
                        <p>${totalCount} Chapters</p>
                    </div>
                    <div class="subject-stat" style="color: ${cardColor}">${subPercentage}%</div>
                `;
                overviewGrid.appendChild(card);
            });

            let overallPercentage = totalChaptersAll > 0 ? Math.round(totalTheorySum / totalChaptersAll) : 0;
            document.getElementById("syllabusProgressText").textContent = overallPercentage + "%";
            document.getElementById("syllabusProgressBar").style.width = overallPercentage + "%";

            let practicePercentage = totalChaptersAll > 0 ? Math.round(totalPracticeSum / totalChaptersAll) : 0;
            document.getElementById("practiceProgressText").textContent = practicePercentage + "%";
            document.getElementById("practiceProgressBar").style.width = practicePercentage + "%";
            document.getElementById("practiceSubText").textContent = `${totalChaptersAll} Exercises Total`;

            let tabsContainer = document.getElementById("subjectTabsContainer");
            tabsContainer.innerHTML = "";
            Object.keys(curriculum).forEach(subName => {
                let btn = document.createElement("button");
                btn.className = `tab-btn ${currentSubjectTab === subName ? "active" : ""}`;
                btn.textContent = subName;
                btn.onclick = () => { currentSubjectTab = subName; renderDashboard(); };
                tabsContainer.appendChild(btn);
            });

            let chaptersContainer = document.getElementById("chaptersContainer");
            chaptersContainer.innerHTML = "";

            if (currentSubjectTab && curriculum[currentSubjectTab]) {
                let activeSubjectData = curriculum[currentSubjectTab];
                let sectionDiv = document.createElement("div");
                sectionDiv.className = "section-breakdown";
                sectionDiv.innerHTML = `
                    <div class="section-title">
                        ${currentSubjectTab}
                        <button class="add-btn" onclick="addChapter('${currentSubjectTab}')">+ Add Chapter</button>
                    </div>
                `;

                let ul = document.createElement("ul");
                ul.className = "chapter-list";

                activeSubjectData.chapters.forEach(chapName => {
                    let chapProgress = (progress[currentSubjectTab] && progress[currentSubjectTab][chapName]) ? progress[currentSubjectTab][chapName] : { theory: 0, practice: 0 };
                    let theoryVal = chapProgress.theory;
                    let practiceVal = chapProgress.practice;

                    let escapedChapName = chapName.replace(/'/g, "\\'");

                    let li = document.createElement("li");
                    li.className = "chapter-item";
                    li.innerHTML = `
                        <div class="chapter-info">
                            <div class="chapter-title-container">
                                <h5>${chapName}</h5>
                                <button class="icon-btn edit-icon" title="Edit Chapter Name" onclick="editChapter('${currentSubjectTab}', '${escapedChapName}')">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                </button>
                                <button class="icon-btn delete-icon" title="Delete Chapter" onclick="deleteChapter('${currentSubjectTab}', '${escapedChapName}')">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                                </button>
                            </div>
                        </div>
                        <div class="chapter-actions">
                            <div class="progress-controls">
                                <span style="color:var(--text-muted); font-size:0.8rem; width:45px;">Theory:</span>
                                ${[25, 50, 75, 100].map(val => `
                                    <button class="btn-radio ${theoryVal === val ? "active" : ""}" 
                                            onclick="updateProgress('${currentSubjectTab}', '${escapedChapName}', 'theory', ${val})">${val}%</button>
                                `).join('')}
                            </div>
                            <div class="progress-controls">
                                <span style="color:var(--text-muted); font-size:0.8rem; width:55px;">Practice:</span>
                                ${[25, 50, 75, 100].map(val => `
                                    <button class="btn-radio ${practiceVal === val ? "active" : ""}" 
                                            onclick="updateProgress('${currentSubjectTab}', '${escapedChapName}', 'practice', ${val})">${val}%</button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    ul.appendChild(li);
                });

                sectionDiv.appendChild(ul);
                chaptersContainer.appendChild(sectionDiv);
            }
        }

        function resetData() {
            if (confirm("Are you sure you want to reset all progress data and custom curriculum?")) {
                localStorage.clear();
                window.location.href = "onboarding.html";
            }
        }

        window.onload = function() {
            if (!localStorage.getItem("userStream")) {
                window.location.href = "onboarding.html";
                return;
            }
            renderDashboard();
        };
    </script>
</body>
</html>
