<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Class & Stream - Study Centre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-white mb-2">Welcome to Study Centre</h1>
            <p class="text-sm text-slate-400">Please select your class and stream to customize your dashboard.</p>
        </div>

        <form id="onboarding-form" class="space-y-5">
            <!-- Class Selection -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Select Class</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" class="class-btn py-3 px-4 rounded-xl border border-slate-700 bg-slate-800 text-center font-medium hover:border-indigo-500 focus:outline-none transition-all" data-class="11">Class 11</button>
                    <button type="button" class="class-btn py-3 px-4 rounded-xl border border-slate-700 bg-slate-800 text-center font-medium hover:border-indigo-500 focus:outline-none transition-all" data-class="12">Class 12</button>
                </div>
                <input type="hidden" id="selected-class" name="class" required>
            </div>

            <!-- Stream Selection (Hidden by default, shown for Class 11/12) -->
            <div id="stream-container" class="space-y-2">
                <label class="block text-sm font-medium text-slate-300 mb-2">Select Stream</label>
                <div class="grid grid-cols-1 gap-2">
                    <button type="button" class="stream-btn py-2.5 px-4 rounded-xl border border-slate-700 bg-slate-800 text-left font-medium hover:border-indigo-500 focus:outline-none transition-all" data-stream="PCM">Science (PCM - Physics, Chemistry, Math)</button>
                    <button type="button" class="stream-btn py-2.5 px-4 rounded-xl border border-slate-700 bg-slate-800 text-left font-medium hover:border-indigo-500 focus:outline-none transition-all" data-stream="PCB">Science (PCB - Physics, Chemistry, Biology)</button>
                </div>
                <input type="hidden" id="selected-stream" name="stream">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg transition-all mt-4">
                Continue to Dashboard
            </button>
        </form>
    </div>

    <script>
        const classBtns = document.querySelectorAll('.class-btn');
        const streamBtns = document.querySelectorAll('.stream-btn');
        const selectedClassInput = document.getElementById('selected-class');
        const selectedStreamInput = document.getElementById('selected-stream');

        classBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                classBtns.forEach(b => b.classList.remove('border-indigo-500', 'bg-indigo-950/40', 'text-indigo-400'));
                btn.classList.add('border-indigo-500', 'bg-indigo-950/40', 'text-indigo-400');
                selectedClassInput.value = btn.getAttribute('data-class');
            });
        });

        streamBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                streamBtns.forEach(b => b.classList.remove('border-indigo-500', 'bg-indigo-950/40', 'text-indigo-400'));
                btn.classList.add('border-indigo-500', 'bg-indigo-950/40', 'text-indigo-400');
                selectedStreamInput.value = btn.getAttribute('data-stream');
            });
        });

        document.getElementById('onboarding-form').addEventListener('submit', (e) => {
            e.preventDefault();
            if (!selectedClassInput.value) {
                alert('Please select your class.');
                return;
            }
            // Save preferences (can be expanded later with localStorage)
            localStorage.setItem('userClass', selectedClassInput.value);
            localStorage.setItem('userStream', selectedStreamInput.value);
            
            // Redirect back to main dashboard
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
